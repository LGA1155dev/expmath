<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratório Exponencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0d0a17;
  --bg-1:#161129;
  --bg-2:#1e1839;
  --panel:#201a3a;
  --panel-line:rgba(163,148,255,0.14);
  --ink:#eee9ff;
  --ink-dim:#a79fce;
  --ink-faint:#6f6796;

  --purple:#a370f7;
  --purple-deep:#6d3bd6;
  --purple-glow:rgba(163,112,247,0.35);

  --blue:#4d9dff;
  --blue-deep:#2c6fd4;

  --green:#39d98a;
  --green-deep:#1fa868;

  --red:#ff5d6c;
  --red-deep:#d13a49;

  --yellow:#ffcc4d;
  --yellow-deep:#e0a825;

  --orange:#ff9152;
  --orange-deep:#e0722f;

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;

  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(163,112,247,0.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(77,157,255,0.12), transparent 55%),
    var(--bg-0);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* graph-paper texture behind everything */
.grid-bg{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.35;
  background-image:
    linear-gradient(rgba(163,148,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(163,148,255,0.05) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse 100% 60% at 50% 0%, black 30%, transparent 90%);
}

#app{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:20px 16px 80px;}

/* ---------- HEADER ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 18px; border-radius:var(--radius-lg);
  background:linear-gradient(180deg, rgba(38,30,68,0.9), rgba(24,18,46,0.9));
  border:1px solid var(--panel-line);
  box-shadow:0 10px 30px -14px rgba(0,0,0,0.6);
  position:sticky; top:12px; z-index:20; backdrop-filter:blur(8px);
  margin-bottom:22px;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-flask{width:38px; height:38px; flex:none;}
.brand-text .kicker{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; color:var(--purple); text-transform:uppercase;}
.brand-text h1{font-family:var(--font-display); font-size:17px; margin:1px 0 0; font-weight:700; letter-spacing:.01em;}

.xp-cluster{display:flex; align-items:center; gap:14px;}
.level-badge{
  font-family:var(--font-mono); font-size:12px; color:var(--bg-0); font-weight:700;
  background:linear-gradient(135deg, var(--yellow), var(--orange));
  padding:5px 10px; border-radius:999px; white-space:nowrap;
}
.xp-bar-wrap{width:120px;}
.xp-bar-label{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint); margin-bottom:3px; display:flex; justify-content:space-between;}
.xp-bar-track{height:7px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
.xp-bar-fill{height:100%; background:linear-gradient(90deg, var(--purple-deep), var(--purple)); border-radius:999px; transition:width .5s ease;}

@media (max-width:560px){
  .xp-bar-wrap{width:78px;}
  .brand-text h1{font-size:14px;}
}

/* ---------- BUTTONS ---------- */
button{font-family:inherit; cursor:pointer;}
.btn{
  border:none; border-radius:var(--radius-sm); padding:12px 20px; font-weight:600; font-size:14.5px;
  font-family:var(--font-display); letter-spacing:.01em; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  color:var(--ink);
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--purple), var(--blue)); color:#0d0a17; box-shadow:0 8px 22px -8px var(--purple-glow);}
.btn-ghost{background:rgba(255,255,255,0.05); border:1px solid var(--panel-line); color:var(--ink-dim);}
.btn-ghost:hover{color:var(--ink); border-color:var(--purple);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn-sm{padding:8px 14px; font-size:12.5px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

/* ---------- PANELS / CARDS ---------- */
.panel{
  background:linear-gradient(180deg, rgba(32,26,58,0.85), rgba(20,15,38,0.85));
  border:1px solid var(--panel-line); border-radius:var(--radius-lg);
  padding:22px; margin-bottom:16px; box-shadow:0 14px 34px -20px rgba(0,0,0,0.7);
}
.panel-tight{padding:16px 18px;}

.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--purple); margin:0 0 8px; display:flex; align-items:center; gap:8px;
}
.eyebrow.blue{color:var(--blue);}
.eyebrow.green{color:var(--green);}

h2.phase-title{font-family:var(--font-display); font-size:24px; margin:0 0 6px; line-height:1.2;}
p.lede{color:var(--ink-dim); font-size:15px; line-height:1.55; margin:0 0 18px;}

.formula{
  font-family:var(--font-mono); font-size:15px; background:rgba(255,255,255,0.04);
  border:1px solid var(--panel-line); border-radius:8px; padding:2px 8px; color:var(--ink);
}

/* big equation stage */
.stage{
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  font-family:var(--font-mono); font-weight:700; padding:34px 16px; border-radius:var(--radius-md);
  background:radial-gradient(ellipse at 50% 0%, rgba(163,112,247,0.14), transparent 70%), rgba(255,255,255,0.02);
  border:1px solid var(--panel-line); margin-bottom:18px;
}
.stage-num{font-size:52px; color:var(--ink);}
.stage-num.base-hl{color:var(--blue); text-shadow:0 0 20px rgba(77,157,255,0.5);}
.stage-num.exp-hl{color:var(--purple); vertical-align:super; font-size:30px; text-shadow:0 0 20px rgba(163,112,247,0.6); cursor:pointer; border-bottom:2px dashed var(--purple); padding-bottom:2px;}
.exp-sup{font-size:0.55em; vertical-align:super; position:relative; top:-0.4em;}

.click-hint{font-family:var(--font-mono); font-size:11px; color:var(--yellow); text-align:center; margin-top:-6px; margin-bottom:14px;}

/* option grid */
.options-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:6px;}
@media (max-width:520px){.options-grid{grid-template-columns:1fr;}}
.opt-btn{
  text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--panel-line);
  background:rgba(255,255,255,0.03); color:var(--ink); font-family:var(--font-mono); font-size:16px; font-weight:600;
  display:flex; align-items:center; gap:10px; transition:all .15s ease;
}
.opt-btn .opt-letter{
  width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center;
  font-size:12px; color:var(--ink-faint); flex:none;
}
.opt-btn:hover:not(:disabled){border-color:var(--purple); background:rgba(163,112,247,0.08);}
.opt-btn.correct{border-color:var(--green); background:rgba(57,217,138,0.12); color:var(--green);}
.opt-btn.incorrect{border-color:var(--red); background:rgba(255,93,108,0.12); color:var(--red);}
.opt-btn:disabled{cursor:default;}

/* feedback boxes */
.feedback{border-radius:12px; padding:14px 16px; margin-top:14px; font-size:14.5px; line-height:1.55; border:1px solid transparent;}
.feedback.ok{background:rgba(57,217,138,0.1); border-color:rgba(57,217,138,0.35); color:#a9f6cf;}
.feedback.err{background:rgba(255,93,108,0.1); border-color:rgba(255,93,108,0.35); color:#ffc2c8;}
.feedback.hint{background:rgba(255,204,77,0.09); border-color:rgba(255,204,77,0.3); color:#ffe6a3;}
.feedback b{color:inherit;}
.feedback .tag{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.85; display:block; margin-bottom:4px;}

.breakdown{
  display:flex; flex-direction:column; align-items:center; gap:6px; margin:14px 0; font-family:var(--font-mono);
}
.breakdown-line{font-size:17px; padding:6px 14px; border-radius:8px; background:rgba(255,255,255,0.04); opacity:0; transform:translateY(6px); animation:riseIn .45s ease forwards;}
.breakdown-arrow{color:var(--ink-faint); font-size:13px;}
@keyframes riseIn{to{opacity:1; transform:translateY(0);}}

/* XP toast */
.xp-toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-30px); z-index:100;
  background:linear-gradient(135deg, var(--green), var(--green-deep)); color:#04160d; font-family:var(--font-display); font-weight:700;
  padding:10px 20px; border-radius:999px; box-shadow:0 12px 30px -10px rgba(57,217,138,0.6); opacity:0; transition:all .35s ease; pointer-events:none;
}
.xp-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- MAP ---------- */
.map-wrap{position:relative; padding:10px 4px 20px;}
.map-track{
  position:absolute; left:29px; top:26px; bottom:26px; width:3px;
  background:linear-gradient(180deg, var(--purple-deep), var(--blue-deep), var(--panel-line));
  border-radius:3px; opacity:.55; z-index:0;
}
.map-node{
  position:relative; z-index:1; display:flex; align-items:center; gap:16px; padding:12px 14px 12px 4px;
  border-radius:16px; margin-bottom:6px; transition:background .15s ease;
}
.map-node:hover{background:rgba(255,255,255,0.03);}
.node-badge{
  width:58px; height:58px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px;
  border:2px solid var(--panel-line); background:var(--panel); position:relative; z-index:2;
}
.node-badge.unlocked{border-color:var(--purple); box-shadow:0 0 0 5px rgba(163,112,247,0.12);}
.node-badge.done{border-color:var(--green); background:rgba(57,217,138,0.14); box-shadow:0 0 0 5px rgba(57,217,138,0.1);}
.node-badge.locked{opacity:.4; filter:grayscale(1);}
.node-body{flex:1;}
.node-title{font-family:var(--font-display); font-weight:700; font-size:15.5px; margin:0 0 2px;}
.node-sub{font-size:12.5px; color:var(--ink-faint); margin:0;}
.node-cta{flex:none;}
.node-mastery{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:4px;}

/* dominance bars */
.mastery-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.mastery-label{width:120px; font-size:12.5px; color:var(--ink-dim); flex:none;}
.mastery-track{flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
.mastery-fill{height:100%; border-radius:999px; transition:width .6s ease;}
.mastery-pct{width:36px; text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); flex:none;}

/* nav */
.crumb{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.crumb-back{
  display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-faint); font-family:var(--font-mono);
  font-size:12.5px; padding:6px 10px 6px 0;
}
.crumb-back:hover{color:var(--purple);}

/* memory cards */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.mem-card{
  aspect-ratio:3/4; border-radius:14px; cursor:pointer; position:relative; perspective:800px;
}
.mem-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
.mem-card.flipped .mem-inner{transform:rotateY(180deg);}
.mem-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; border:1.5px solid var(--panel-line);}
.mem-front{background:linear-gradient(160deg, var(--purple-deep), var(--bg-1)); font-family:var(--font-display); font-weight:700; font-size:13px;}
.mem-back{background:linear-gradient(160deg, var(--blue-deep), var(--bg-1)); transform:rotateY(180deg); font-size:13.5px; color:var(--ink);}

/* table fill-in */
.fx-table{width:100%; border-collapse:collapse; font-family:var(--font-mono); margin:10px 0 4px;}
.fx-table th, .fx-table td{border:1px solid var(--panel-line); padding:10px; text-align:center; font-size:15px;}
.fx-table th{color:var(--ink-faint); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;}
.fx-input{
  width:64px; background:rgba(255,255,255,0.04); border:1.5px solid var(--panel-line); border-radius:8px; color:var(--ink);
  font-family:var(--font-mono); font-size:15px; text-align:center; padding:6px 4px;
}
.fx-input:focus{outline:none; border-color:var(--purple);}
.fx-input.correct{border-color:var(--green); background:rgba(57,217,138,0.1);}
.fx-input.incorrect{border-color:var(--red); background:rgba(255,93,108,0.1);}

/* growth/decay chip */
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-family:var(--font-mono); font-size:12px; font-weight:600;}
.chip.up{background:rgba(57,217,138,0.15); color:var(--green);}
.chip.down{background:rgba(255,145,82,0.15); color:var(--orange);}

/* free lab controls */
.slider-row{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
input[type=range]{flex:1; accent-color:var(--purple);}
.a-readout{font-family:var(--font-mono); font-size:20px; font-weight:700; width:70px; text-align:center; color:var(--purple);}
.numfield{
  background:rgba(255,255,255,0.05); border:1.5px solid var(--panel-line); border-radius:8px; color:var(--ink);
  font-family:var(--font-mono); font-size:15px; padding:8px 10px; width:90px; text-align:center;
}
.numfield:focus{outline:none; border-color:var(--purple);}

/* boss */
.hearts{display:flex; gap:6px; font-size:20px;}
.boss-progress{display:flex; gap:5px; margin:12px 0 18px;}
.boss-dot{width:100%; height:6px; border-radius:999px; background:rgba(255,255,255,0.08);}
.boss-dot.done{background:var(--green);}
.boss-dot.current{background:var(--purple);}
.boss-dot.fail{background:var(--red);}

.dominance-summary{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.dom-pill{font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--ink-dim);}

.svg-graph{width:100%; height:auto; touch-action:none;}
.graph-tooltip{font-family:var(--font-mono); font-size:12px; fill:var(--ink);}

.fadein{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.step-track{display:flex; gap:5px; margin-bottom:16px;}
.step-dot{flex:1; height:5px; border-radius:999px; background:rgba(255,255,255,0.08);}
.step-dot.done{background:var(--green);}
.step-dot.current{background:var(--purple);}

.small-note{font-size:12.5px; color:var(--ink-faint); margin-top:10px;}
.divider{height:1px; background:var(--panel-line); margin:18px 0;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div id="app"></div>
<div class="xp-toast" id="xpToast"></div>

<script>
/* ======================================================================
   LABORATÓRIO EXPONENCIAL — motor do módulo
   ====================================================================== */
const STORAGE_KEY = 'expLab_state_v1';

var PHASES = [
  {id:1,  icon:'🥚', title:'O que é uma potência?',        sub:'A base do laboratório', skill:'potencia'},
  {id:2,  icon:'🔢', title:'Base e expoente',                sub:'Aprenda a nomear as partes', skill:'potencia'},
  {id:3,  icon:'⚡', title:'Calculando potências',           sub:'Treino progressivo', skill:'potencia'},
  {id:4,  icon:'🧠', title:'Expoente zero',                  sub:'O truque do 1', skill:'potencia'},
  {id:5,  icon:'🧪', title:'O que é função exponencial?',    sub:'O x sobe pro expoente', skill:'funcaoExp'},
  {id:6,  icon:'🔢', title:'Calculando f(x)',                sub:'Passo a passo', skill:'funcaoExp'},
  {id:7,  icon:'📊', title:'Construindo tabelas',            sub:'De função pra tabela', skill:'graficos'},
  {id:8,  icon:'📈', title:'Gráfico exponencial',            sub:'Ver a curva nascer', skill:'graficos'},
  {id:9,  icon:'🚀', title:'Crescimento exponencial',        sub:'Quando a > 1', skill:'graficos'},
  {id:10, icon:'📉', title:'Decrescimento exponencial',      sub:'Quando 0 < a < 1', skill:'graficos'},
  {id:11, icon:'🧩', title:'Equações exponenciais',          sub:'Descobrindo o x', skill:'equacoes'},
  {id:12, icon:'👹', title:'BOSS FINAL',                      sub:'O Devorador de Expoentes', skill:'boss'},
];

var SKILL_LABELS = {
  potencia:'Potências', funcaoExp:'Função exponencial', graficos:'Gráficos', equacoes:'Equações'
};
var SKILL_COLORS = {
  potencia:'var(--blue)', funcaoExp:'var(--purple)', graficos:'var(--green)', equacoes:'var(--yellow)'
};

function defaultState(){
  return {
    xp: 0,
    unlockedPhase: 1,
    completedPhases: {},
    mastery: { potencia:0, funcaoExp:0, graficos:0, equacoes:0 },
    errorStreak: {},          // per skill, consecutive wrong answers (for recovery mission)
    memCardsSeen: {},
    bossBest: 0,
    freeLabA: 2,
  };
}

var STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}
function resetState(){
  if(confirm('Isso vai apagar todo o seu progresso no Laboratório Exponencial. Tem certeza?')){
    STATE = defaultState();
    saveState();
    goToMap();
  }
}

function levelFromXP(xp){ return Math.floor(xp/120) + 1; }
function xpIntoLevel(xp){ return xp % 120; }

function addXP(amount){
  const before = levelFromXP(STATE.xp);
  STATE.xp += amount;
  const after = levelFromXP(STATE.xp);
  saveState();
  showXPToast('+' + amount + ' XP' + (after>before ? '  •  Nível ' + after + '!' : ''));
  renderHeader();
}

function showXPToast(text){
  const t = document.getElementById('xpToast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(window.__xpTimer);
  window.__xpTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function bumpMastery(skill, delta){
  if(!(skill in STATE.mastery)) return;
  STATE.mastery[skill] = Math.max(0, Math.min(100, STATE.mastery[skill] + delta));
  saveState();
}

function registerError(skill){
  STATE.errorStreak[skill] = (STATE.errorStreak[skill]||0) + 1;
  saveState();
  return STATE.errorStreak[skill];
}
function clearErrorStreak(skill){
  STATE.errorStreak[skill] = 0;
  saveState();
}

function completePhase(id){
  STATE.completedPhases[id] = true;
  if(STATE.unlockedPhase <= id && id < PHASES.length){
    STATE.unlockedPhase = id + 1;
  }
  saveState();
}

/* ---------------- helpers de matemática ---------------- */
function powInt(base, exp){ return Math.pow(base, exp); }
function fmtNum(n){
  if(Number.isInteger(n)) return String(n);
  // show clean fractions for negative powers like 0.5, 0.25 etc handled elsewhere
  return String(Math.round(n*1000)/1000);
}
function asFrac(base, exp){
  // base < 1 like 0.5 -> show as 1/2^n when useful; used for decay displays
  return null;
}

/* ---------------- roteamento simples ---------------- */
var CURRENT_VIEW = 'map';
function goToMap(){ CURRENT_VIEW='map'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goToPhase(id){ CURRENT_VIEW='phase'; CURRENT_PHASE=id; PHASE_STEP_INDEX=0; render(); window.scrollTo({top:0,behavior:'smooth'}); }
var CURRENT_PHASE = 1;
var PHASE_STEP_INDEX = 0;

function render(){
  const app = document.getElementById('app');
  app.innerHTML = headerHTML();
  const container = document.createElement('div');
  container.className = 'fadein';
  if(CURRENT_VIEW === 'map'){
    container.innerHTML = mapHTML();
  } else if(CURRENT_VIEW === 'phase'){
    container.innerHTML = crumbHTML(PHASES.find(p=>p.id===CURRENT_PHASE)) + phaseShellHTML(CURRENT_PHASE);
  } else if(CURRENT_VIEW === 'freelab'){
    container.innerHTML = crumbHTML() + freeLabHTML();
  } else if(CURRENT_VIEW === 'memcards'){
    container.innerHTML = crumbHTML() + memCardsHTML();
  }
  app.appendChild(container);
  afterRenderHooks();
}

function renderHeader(){
  const bar = document.getElementById('topbarWrap');
  if(bar) bar.outerHTML = headerHTML();
}

function headerHTML(){
  const lvl = levelFromXP(STATE.xp);
  const pct = Math.round((xpIntoLevel(STATE.xp)/120)*100);
  return `
  <div class="topbar" id="topbarWrap">

}

/* ======================================================================
   MOTOR DE EXERCÍCIOS — componentes reutilizáveis
   ====================================================================== */

/*
  Registro de exercícios ativos na tela. Cada exercício tem um id único (elId),
  e guardamos seu "modelo" (config) para poder re-renderizar feedback/estado sem
  reconstruir a fase inteira.
*/
var EX_REGISTRY = {};

/*
  Exercício de múltipla escolha com diagnóstico de erro.
  cfg = {
    id, formulaHTML (opcional), question, options:[{label,value}], correctIndex,
    explainCorrect, skill, xp,
    diagnose(idx) -> retorna string explicando o erro específico (opcional),
    onMastered(container) -> chamado quando o aluno finalmente acerta
    breakdown: array de strings (linhas) usadas na reconstrução passo a passo quando erra
  }
*/
function mcExercise(cfg){
  EX_REGISTRY[cfg.id] = Object.assign({attempts:0, solved:false, showingBreakdown:false}, cfg);
  return renderMC(cfg.id);
}

function renderMC(id){
  const cfg = EX_REGISTRY[id];
  const optsHTML = cfg.options.map((o,i)=>{
    let cls = 'opt-btn';
    if(cfg.solved){
      if(i===cfg.correctIndex) cls += ' correct';
      else if(cfg.lastWrong===i) cls += ' incorrect';
    }
    return `<button class="${cls}" ${cfg.solved?'disabled':''} onclick="answerMC('${id}', ${i})">
      <span class="opt-letter">${String.fromCharCode(65+i)}</span> ${o}
    </button>`;
  }).join('');

  return `
  <div id="wrap_${id}" class="ex-wrap">
    ${cfg.formulaHTML ? `<div class="stage">${cfg.formulaHTML}</div>` : ''}
    <p style="font-family:var(--font-mono); font-size:15.5px; margin:0 0 12px;">${cfg.question}</p>
    <div class="options-grid">${optsHTML}</div>
    <div id="fb_${id}"></div>
  </div>`;
}

function answerMC(id, idx){
  const cfg = EX_REGISTRY[id];
  if(cfg.solved) return;
  cfg.attempts++;
  const wrap = document.getElementById('wrap_'+id);
  const fb = document.getElementById('fb_'+id);

  if(idx === cfg.correctIndex){
    cfg.solved = true;
    clearErrorStreak(cfg.skill);
    wrap.outerHTML = renderMC(id);
    document.getElementById('fb_'+id).innerHTML = `
      <div class="feedback ok fadein">
        <span class="tag">✅ Certo</span>
        ${cfg.explainCorrect || 'Boa! Você acertou.'}
      </div>
      <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="${cfg.nextAction||''}">Continuar →</button></div>
    `;
    if(cfg.xp) addXP(cfg.xp);
    bumpMastery(cfg.skill, 6);
    if(cfg.onMastered) cfg.onMastered();
    return;
  }

  // errado
  cfg.lastWrong = idx;
  const streak = registerError(cfg.skill);
  bumpMastery(cfg.skill, -2);
  wrap.outerHTML = renderMC(id);
  const diag = cfg.diagnose ? cfg.diagnose(idx) : null;

  let html = `<div class="feedback err fadein"><span class="tag">❌ Não foi essa</span>`;
  html += diag ? diag : 'Vamos desmontar essa conta juntos.';
  html += `</div>`;

  if(cfg.breakdown && cfg.breakdown.length){
    html += breakdownHTML(cfg.breakdown);
  }

  html += `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="retryMC('${id}')">Tentar de novo</button></div>`;

  if(streak >= 3 && cfg.recoveryFn){
    html += `<div class="feedback hint fadein" style="margin-top:10px;">
      <span class="tag">🩹 Missão de recuperação</span>
      Você está tendo dificuldade com <b>${SKILL_LABELS[cfg.skill]||cfg.skill}</b>. Vamos fazer 3 exercícios bem simples antes de continuar.
    </div>
    <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="${cfg.recoveryFn}">Iniciar recuperação</button></div>`;
  }

  document.getElementById('fb_'+id).innerHTML = html;
}

function retryMC(id){
  const cfg = EX_REGISTRY[id];
  document.getElementById('wrap_'+id).outerHTML = renderMC(id);
}

function breakdownHTML(lines){
  const rows = lines.map((l,i)=>`<div class="breakdown-line" style="animation-delay:${i*0.18}s">${l}</div>${i<lines.length-1?'<div class="breakdown-arrow">↓</div>':''}`).join('');
  return `<div class="breakdown">${rows}</div>`;
}

/*
  StepFlow: sequência de micro-passos que o aluno precisa confirmar/responder em ordem.
  steps = [{title, body(html), type:'confirm'|'mc'|'input', options, correct, explain, checkFn(val)}]
  Ao concluir todos, chama onDone().
*/
function stepFlow(cfg){
  EX_REGISTRY[cfg.id] = Object.assign({idx:0, done:false}, cfg);
  return renderStepFlow(cfg.id);
}

function renderStepFlow(id){
  const cfg = EX_REGISTRY[id];
  const total = cfg.steps.length;
  const dots = cfg.steps.map((s,i)=>{
    let c='step-dot'; if(i<cfg.idx) c+=' done'; else if(i===cfg.idx) c+=' current';
    return `<div class="${c}"></div>`;
  }).join('');

  if(cfg.idx >= total){
    return `<div id="wrap_${id}">
      <div class="step-track">${dots}</div>
      <div class="feedback ok fadein"><span class="tag">✅ Etapa concluída</span>${cfg.doneMessage||'Você completou todos os passos.'}</div>
      <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="${cfg.nextAction||''}">Continuar →</button></div>
    </div>`;
  }

  const step = cfg.steps[cfg.idx];
  let body = `<p style="font-family:var(--font-mono); font-size:15px; margin:0 0 12px; color:var(--ink-dim);"><b style="color:var(--ink)">Passo ${cfg.idx+1}:</b> ${step.title}</p>`;
  body += step.body || '';

  if(step.type === 'confirm'){
    body += `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="stepAdvance('${id}')">Entendi, próximo →</button></div>`;
  } else if(step.type === 'mc'){
    const opts = step.options.map((o,i)=>`<button class="opt-btn" onclick="stepAnswer('${id}', ${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span> ${o}</button>`).join('');
    body += `<div class="options-grid">${opts}</div>`;
  } else if(step.type === 'input'){
    body += `<div style="display:flex; gap:10px; align-items:center; margin-top:6px;">
      <input class="numfield" id="stepInput_${id}" type="text" placeholder="?" onkeydown="if(event.key==='Enter') stepAnswerInput('${id}')">
      <button class="btn btn-primary btn-sm" onclick="stepAnswerInput('${id}')">Confirmar</button>
    </div>`;
  }

  return `<div id="wrap_${id}">
    <div class="step-track">${dots}</div>
    ${body}
    <div id="stepFb_${id}"></div>
  </div>`;
}

function stepAdvance(id){
  const cfg = EX_REGISTRY[id];
  cfg.idx++;
  document.getElementById('wrap_'+id).outerHTML = renderStepFlow(id);
}

function stepAnswer(id, idx){
  const cfg = EX_REGISTRY[id];
  const step = cfg.steps[cfg.idx];
  const fb = document.getElementById('stepFb_'+id);
  if(idx === step.correct){
    fb.innerHTML = `<div class="feedback ok fadein"><span class="tag">✅ Isso</span>${step.explain||''}</div>
      <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="stepAdvance('${id}')">Próximo passo →</button></div>`;
  }else{
    fb.innerHTML = `<div class="feedback err fadein"><span class="tag">❌ Ainda não</span>${step.wrongHint||'Reveja o passo acima e tente de novo.'}</div>`;
  }
}

function stepAnswerInput(id){
  const cfg = EX_REGISTRY[id];
  const step = cfg.steps[cfg.idx];
  const val = document.getElementById('stepInput_'+id).value.trim().replace(',','.');
  const fb = document.getElementById('stepFb_'+id);
  const ok = step.checkFn ? step.checkFn(val) : (parseFloat(val)===step.correct);
  if(ok){
    fb.innerHTML = `<div class="feedback ok fadein"><span class="tag">✅ Isso</span>${step.explain||''}</div>
      <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="stepAdvance('${id}')">Próximo passo →</button></div>`;
  }else{
    fb.innerHTML = `<div class="feedback err fadein"><span class="tag">❌ Ainda não</span>${step.wrongHint||'Confira a conta e tente de novo.'}</div>`;
  }
}

   ====================================================================== */
function phase1HTML(){

}
function p1_reveal(){
  const el = document.getElementById('p1_reveal');
  el.innerHTML = `
    ${breakdownHTML(['2 × 2 × 2','<b style="color:var(--green)">8</b>'])}
    <div class="feedback hint fadein">
      <span class="tag">🟡 Repare</span>
      O número pequeno (<b>3</b>) diz <b>quantas vezes</b> o 2 aparece multiplicado. Ele se chama <b style="color:var(--purple)">expoente</b>.<br>

}
function p1_toQuiz(){
  setPhaseBody(`
    <p class="lede">Sua vez. Calcule esta potência:</p>
    ${mcExercise({
      id:'p1q1',
      formulaHTML:`<span class="stage-num base-hl">3</span><span class="stage-num exp-hl">2</span>`,
      question:'Quanto é 3²?',
      options:['5','6','9','12'],
      correctIndex:2,
      skill:'potencia',
      xp:20,
      explainCorrect:'3² significa 3 × 3, e 3 × 3 = 9.',
      diagnose(idx){
        if(idx===1) return 'Parece que você multiplicou a base pelo expoente (3 × 2 = 6). Mas expoente não funciona assim — ele diz <b>quantas vezes</b> o 3 se repete multiplicado por ele mesmo.';
        if(idx===0) return 'Parece que você somou 3 + 2 = 5. Potência não é soma, é multiplicação repetida.';
        if(idx===3) return 'Quase — mas 12 não sai dessa conta. Vamos ver com calma o que 3² realmente significa.';
        return 'Vamos desmontar essa potência juntos.';
      },

      nextAction:'p1_finish()',

    })}
  `);

function p1_recovery(){
  setPhaseBody(`
  <div class="feedback hint"><span class="tag">🩹 Recuperação</span>Vamos com calma, em 3 perguntinhas rápidas.</div>
  <div id="p1rec"></div>
  `);

  });
}
function p1_finish(){

}

/* ======================================================================
   FASE 2 — BASE E EXPOENTE
   ====================================================================== */
var P2_ITEMS = [
  {base:5, exp:3}, {base:7, exp:2}, {base:4, exp:4}
];
var p2_idx = 0;
function phase2HTML(){
  p2_idx = 0;
  return p2_round();
}
function p2_round(){
  if(p2_idx >= P2_ITEMS.length){
    return markPhaseDone(2, 'Você já reconhece a base e o expoente em qualquer potência.');
  }
  const it = P2_ITEMS[p2_idx];
  return `
  <p class="lede">Clique primeiro na <b style="color:var(--blue)">BASE</b>, depois no <b style="color:var(--purple)">EXPOENTE</b>.</p>
  <div class="stage">
    <span class="stage-num" id="p2base" style="cursor:pointer; border-bottom:2px dashed var(--blue); padding-bottom:2px;" onclick="p2_click('base')">${it.base}</span><span class="stage-num exp-sup" id="p2exp" style="cursor:pointer; border-bottom:2px dashed var(--purple); padding-bottom:2px;" onclick="p2_click('exp')">${it.exp}</span>
  </div>
  <div id="p2fb"></div>
  `;
}
var p2_clicked = {base:false, exp:false};
function p2_click(which){
  const it = P2_ITEMS[p2_idx];
  p2_clicked[which] = true;
  const fb = document.getElementById('p2fb');
  const msg = which==='base'
    ? `<div class="feedback ok fadein"><span class="tag">🟦 Base</span>Base = <b>${it.base}</b>. É o número que se repete na multiplicação.</div>`
    : `<div class="feedback ok fadein" style="margin-top:8px;"><span class="tag">🟣 Expoente</span>Expoente = <b>${it.exp}</b>. É o número de vezes que a base se repete.</div>`;
  fb.innerHTML += msg;
  if(p2_clicked.base && p2_clicked.exp){
    fb.innerHTML += `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="p2_next()">Próxima →</button></div>`;
    addXP(10);
    bumpMastery('potencia', 4);
  }
}
function p2_next(){
  p2_idx++; p2_clicked = {base:false, exp:false};
  setPhaseBody(p2_round());
}

/* ======================================================================
   FASE 3 — CALCULANDO POTÊNCIAS (dificuldade progressiva)
   ====================================================================== */
var P3_ITEMS = [
  {base:2, exp:3}, {base:3, exp:2}, {base:4, exp:2}, {base:5, exp:3}, {base:10, exp:2}, {base:2, exp:5}
];
var p3_idx = 0;
function phase3HTML(){ p3_idx = 0; return p3_round(); }
function p3_round(){
  if(p3_idx >= P3_ITEMS.length){
    return markPhaseDone(3, 'Você já calcula potências com bases e expoentes diferentes.');
  }
  const it = P3_ITEMS[p3_idx];
  const correct = powInt(it.base, it.exp);
  const wrongMul = it.base * it.exp;          // erro clássico: base × expoente
  const wrongAdd = it.base + it.exp;          // erro clássico: soma
  const wrongOther = correct + it.base;       // distrator plausível
  let opts = [correct, wrongMul, wrongAdd, wrongOther];
  // remove duplicados mantendo o correto
  opts = [...new Set(opts)];
  while(opts.length < 4) opts.push(correct + Math.floor(Math.random()*5)+2);
  // embaralha mas lembra o índice correto
  const order = opts.map((v,i)=>i).sort(()=>Math.random()-0.5);
  const shuffled = order.map(i=>opts[i]);
  const correctIndex = shuffled.indexOf(correct);

  return `
  <p class="lede">Exercício ${p3_idx+1} de ${P3_ITEMS.length}</p>
  ${mcExercise({
    id:'p3q'+p3_idx,
    formulaHTML:`<span class="stage-num base-hl">${it.base}</span><span class="stage-num exp-hl">${it.exp}</span>`,
    question:`Quanto é ${it.base}${supNum(it.exp)}?`,
    options: shuffled.map(String),
    correctIndex,
    skill:'potencia', xp:15,
    explainCorrect:`${it.base}${supNum(it.exp)} = ${Array(it.exp).fill(it.base).join(' × ')} = ${correct}.`,
    diagnose(idx){
      const chosen = shuffled[idx];
      if(chosen === wrongMul) return `Parece que você multiplicou base × expoente (${it.base} × ${it.exp} = ${wrongMul}). Mas o expoente diz <b>quantas vezes repetir a base</b>, não é um fator direto.`;
      if(chosen === wrongAdd) return `Parece que você somou ${it.base} + ${it.exp} = ${wrongAdd}. Potência é multiplicação repetida, não soma.`;
      return 'Vamos desmontar essa potência com calma.';
    },
    breakdown:[`${it.base}${supNum(it.exp)}`, Array(it.exp).fill(it.base).join(' × '), `<b style="color:var(--green)">${correct}</b>`],
    nextAction:'p3_next()',
    recoveryFn:'p3_recovery()'
  })}
  `;
}
function supNum(n){
  const map = {0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
  return String(n).split('').map(d=>map[d]||d).join('');
}
function p3_next(){ p3_idx++; setPhaseBody(p3_round()); }

  setPhaseBody(`

/* ======================================================================
   GRÁFICO SVG REUTILIZÁVEL (usado nas fases 8, 9, 10, boss e laboratório livre)
   ====================================================================== */
function buildExpGraph(cfg){
  // cfg: {domId, a, xMin, xMax, markers:[x,...]}
  const W = 440, H = 270, PAD_L = 46, PAD_R = 18, PAD_T = 18, PAD_B = 36;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  const xMin = cfg.xMin, xMax = cfg.xMax;
  const markers = cfg.markers || [];
  const a = cfg.a;

  let maxY = 1;
  const curvePts = [];
  const STEPS = 60;
  for(let i=0;i<=STEPS;i++){
    const x = xMin + (xMax-xMin)*i/STEPS;
    const y = Math.pow(a, x);
    curvePts.push({x,y});
    if(y>maxY) maxY = y;
  }
  maxY = maxY * 1.15;

  const sx = x => PAD_L + (x - xMin)/(xMax-xMin) * plotW;
  const sy = y => PAD_T + plotH - (y/maxY) * plotH;

  const pathD = curvePts.map((p,i)=> (i===0?'M':'L') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');

  // eixos
  const axisX = sy(0);
  const axisY = sx(0);

  let gridLines = '';
  for(let gx = Math.ceil(xMin); gx<=Math.floor(xMax); gx++){
    gridLines += `<line x1="${sx(gx)}" y1="${PAD_T}" x2="${sx(gx)}" y2="${PAD_T+plotH}" stroke="rgba(163,148,255,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${sx(gx)}" y="${PAD_T+plotH+16}" text-anchor="middle" class="graph-tooltip" font-size="11">${gx}</text>`;
  }

  let markerDots = '';
  markers.forEach(mx=>{
    const my = Math.pow(a, mx);
    const cx = sx(mx), cy = sy(my);
    markerDots += `<circle cx="${cx}" cy="${cy}" r="6" fill="#0d0a17" stroke="#a370f7" stroke-width="2.5"
      style="cursor:pointer" onmouseenter="graphHover('${cfg.domId}', ${mx}, ${my})" onmouseleave="graphHoverClear('${cfg.domId}')"
      onclick="graphHover('${cfg.domId}', ${mx}, ${my})"/>`;
  });

  return `
  <div style="position:relative;">
    <svg class="svg-graph" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridLines}
      <line x1="${PAD_L}" y1="${PAD_T+plotH}" x2="${PAD_L+plotW}" y2="${PAD_T+plotH}" stroke="rgba(238,233,255,0.3)" stroke-width="1.4"/>
      <line x1="${axisY}" y1="${PAD_T}" x2="${axisY}" y2="${PAD_T+plotH}" stroke="rgba(238,233,255,0.3)" stroke-width="1.4"/>
      <path d="${pathD}" fill="none" stroke="url(#grad_${cfg.domId})" stroke-width="3" stroke-linecap="round"/>
      <defs>
        <linearGradient id="grad_${cfg.domId}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${a>1?'#4d9dff':'#ff9152'}"/>
          <stop offset="100%" stop-color="${a>1?'#a370f7':'#ff5d6c'}"/>
        </linearGradient>
      </defs>
      ${markerDots}
    </svg>
    <div id="${cfg.domId}_readout" class="small-note" style="text-align:center; min-height:18px;">Passe o mouse (ou toque) nos pontos roxos</div>
  </div>`;
}
function graphHover(domId, x, y){
  const el = document.getElementById(domId+'_readout');
  if(el) el.innerHTML = `<span style="color:var(--purple); font-family:var(--font-mono);">x = ${fmtNum(x)}  →  f(x) = ${fmtNum(Math.round(y*1000)/1000)}</span>`;
}
function graphHoverClear(domId){
  const el = document.getElementById(domId+'_readout');
  if(el) el.innerHTML = 'Passe o mouse (ou toque) nos pontos roxos';
}

function p10_round(){
  if(p10_idx >= P10_ITEMS.length){
    return markPhaseDone(10, `Você acertou ${p10_score}/${P10_ITEMS.length} no jogo "Sobe ou desce?". Base > 1 sobe, base entre 0 e 1 desce.`);
  }
  const it = P10_ITEMS[p10_idx];
  const label = it.a===0.33 ? '(1/3)' : (it.a===0.5 ? '(1/2)' : String(it.a));
  return `
  <p class="lede">Item ${p10_idx+1} de ${P10_ITEMS.length}</p>
  <div class="stage"><span style="font-family:var(--font-mono); font-size:28px;">${label}<span class="exp-sup" style="color:var(--purple)">x</span></span></div>
  <div class="options-grid">
    <button class="opt-btn" onclick="p10_answer(true)"><span class="opt-letter">📈</span> Cresce</button>
    <button class="opt-btn" onclick="p10_answer(false)"><span class="opt-letter">📉</span> Decresce</button>
  </div>
  <div id="p10fb"></div>
  `;
}
function p10_answer(guess){
  const it = P10_ITEMS[p10_idx];
  const correct = guess === it.up;
  const fb = document.getElementById('p10fb');
  if(correct){ p10_score++; addXP(10); bumpMastery('graficos',5); }
  else { bumpMastery('graficos',-2); }
  fb.innerHTML = `<div class="feedback ${correct?'ok':'err'} fadein">
    <span class="tag">${correct?'✅ Certo':'❌ Não é isso'}</span>
    a = ${it.a} é ${it.a>1?'maior que 1 → cresce 📈':'menor que 1 → decresce 📉'}.
  </div><div class="btn-row"><button class="btn btn-primary btn-sm" onclick="p10_next()">Próximo →</button></div>`;
}
function p10_next(){ p10_idx++; setPhaseBody(p10_round()); }

/* ======================================================================
   FASE 11 — EQUAÇÕES EXPONENCIAIS
   ====================================================================== */
var P11_EASY = [
  {base:2, target:8, opts:[1,2,3,4], correctVal:3},
  {base:3, target:27, opts:[2,3,4,5], correctVal:3},
  {base:2, target:32, opts:[3,4,5,6], correctVal:5},
  {base:5, target:125, opts:[2,3,4,5], correctVal:3},
];
var p11_idx = 0;
function phase11HTML(){
  p11_idx = 0;
  return `
  <p class="lede">Vamos descobrir o valor de <b>x</b>. Comece bem fácil: pense "a que número eu elevo a base para chegar nesse resultado?"</p>
  <div id="p11area">${p11_round()}</div>
  `;
}
function p11_round(){
  if(p11_idx >= P11_EASY.length) return '';
  const it = P11_EASY[p11_idx];
  const idxCorrect = it.opts.indexOf(it.correctVal);
  return mcExercise({
    id:'p11q'+p11_idx,
    formulaHTML:`<span style="font-family:var(--font-mono); font-size:28px;">${it.base}<span class="exp-sup" style="color:var(--purple)">x</span> = ${it.target}</span>`,
    question:`${it.base} elevado a quanto dá ${it.target}?`,
    options: it.opts.map(String), correctIndex: idxCorrect,
    skill:'equacoes', xp:18,
    explainCorrect:`${it.base}${supNum(it.correctVal)} = ${it.target}, então x = ${it.correctVal}.`,
    diagnose(){ return `Teste os valores: calcule ${it.base} elevado a cada opção até bater com ${it.target}.`; },
    breakdown:[`${it.base}ˣ = ${it.target}`, `${it.base}${supNum(it.correctVal)} = ${it.target}`, `<b style="color:var(--green)">x = ${it.correctVal}</b>`],
    nextAction:'p11_next()',
    recoveryFn:'p11_recovery()'
  });
}
function p11_next(){
  p11_idx++;
  if(p11_idx >= P11_EASY.length){ p11_toSameBase(); return; }
  document.getElementById('p11area').innerHTML = p11_round();
}
function p11_recovery(){
  setPhaseBody(`
  <div class="feedback hint"><span class="tag">🩹 Recuperação</span>Vamos praticar potências simples antes de continuar.</div>
  ${mcExercise({id:'p11rec', question:'Quanto é 2³?', options:['6','8','9'], correctIndex:1, skill:'equacoes', xp:5,
    explainCorrect:'2³ = 2×2×2 = 8.', nextAction:'setPhaseBody(phase11HTML())'})}
  `);
}
function p11_toSameBase(){
  setPhaseBody(`
  <p class="lede">Quando as duas bases já são <b>iguais</b>, fica ainda mais simples: os expoentes têm que ser iguais também.</p>
  <div class="stage"><span style="font-family:var(--font-mono); font-size:28px;">2<span class="exp-sup" style="color:var(--purple)">x</span> = 2<span class="exp-sup" style="color:var(--purple)">3</span></span></div>
  <p class="lede">As bases são iguais (2 = 2), então: <b style="color:var(--green)">x = 3</b>.</p>
  <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="p11_toSameBase2()">Tente uma com um passo a mais →</button></div>
  `);
}
function p11_toSameBase2(){
  setPhaseBody(`
  <p class="lede">Agora com um passo extra:</p>
  ${stepFlow({
    id:'p11sb2',
    steps:[
      {title:'As bases já são iguais (2 = 2). Então os expoentes precisam ser iguais.', type:'confirm',
        body:`<div class="stage" style="padding:22px;"><span style="font-family:var(--font-mono); font-size:24px;">2<span class="exp-sup" style="color:var(--purple)">x+1</span> = 2<span class="exp-sup" style="color:var(--purple)">5</span></span></div>`},
      {title:'Escreva a equação sem as bases.', type:'mc', options:['x + 1 = 5','x - 1 = 5','x = 5'], correct:0,
        explain:'Como as bases são iguais, x + 1 = 5.', wrongHint:'Copie apenas os expoentes: o de cima e o de baixo.'},
      {title:'Resolva x + 1 = 5.', type:'input', body:`<p class="small-note">x = ?</p>`, correct:4,
        explain:'x + 1 = 5  →  x = 4.', wrongHint:'Subtraia 1 dos dois lados: x = 5 − 1.'},
    ],
    doneMessage:'x = 4! Você resolveu igualando os expoentes.',
    nextAction:'p11_toConversion()'
  })}
  `);
}
function p11_toConversion(){
  setPhaseBody(`
  <p class="lede">Desafio de conversão: escreva 32 como potência de 2.</p>
  ${mcExercise({
    id:'p11conv', formulaHTML:`<span style="font-family:var(--font-mono); font-size:30px;">32</span>`,
    question:'Qual dessas potências é igual a 32?', options:['2³','2⁴','2⁵','2⁶'], correctIndex:2,
    skill:'equacoes', xp:15, explainCorrect:'2⁵ = 32.',
    diagnose(idx){ return 'Calcule cada opção: 2×2×2..., até encontrar 32.'; },
    breakdown:['32','2×2×2×2×2','<b style="color:var(--green)">2⁵</b>'],
    nextAction:'p11_toFinalEq()'
  })}
  `);
}
function p11_toFinalEq(){
  setPhaseBody(`
  <p class="lede">Agora junte tudo:</p>
  ${stepFlow({
    id:'p11final',
    steps:[
      {title:'Escreva 32 como potência de 2.', type:'confirm',
        body:`<div class="stage" style="padding:22px;"><span style="font-family:var(--font-mono); font-size:24px;">2<span class="exp-sup" style="color:var(--purple)">x</span> = 32 &nbsp;→&nbsp; 2<span class="exp-sup" style="color:var(--purple)">x</span> = 2<span class="exp-sup" style="color:var(--purple)">5</span></span></div>`},
      {title:'Como as bases são iguais, o que podemos dizer sobre os expoentes?', type:'mc',
        options:['São iguais','Somam 5','Multiplicam 5'], correct:0, explain:'Bases iguais → expoentes iguais: x = 5.', wrongHint:'Pense na regra que acabamos de ver.'},
      {title:'Escreva o valor de x.', type:'input', body:`<p class="small-note">x = ?</p>`, correct:5,
        explain:'x = 5.', wrongHint:'É o expoente que aparece do lado direito.'},
    ],
    doneMessage:'2ˣ = 32 → x = 5. Você uniu conversão de potência com equação de mesma base!',
    nextAction:'p11_finish()'
  })}
  `);
}
function p11_finish(){ addXP(15); bumpMastery('equacoes',10); setPhaseBody(markPhaseDone(11, 'Você já resolve equações exponenciais simples e de mesma base.')); }

/* ======================================================================
   FASE 12 — BOSS FINAL: O DEVORADOR DE EXPOENTES
   ====================================================================== */
var BOSS_QUESTIONS = [
  { skill:'potencia', prompt:'<span style="font-family:var(--font-mono); font-size:28px;">6<span class="exp-sup">2</span></span>',
    q:'Nessa potência, qual é a base e qual é o expoente?', options:['base 6, expoente 2','base 2, expoente 6','base 6, expoente 6'], correct:0,
    explain:'A base é o número que se repete (6); o expoente diz quantas vezes (2).' },
  { skill:'potencia', prompt:'<span style="font-family:var(--font-mono); font-size:28px;">4<span class="exp-sup">3</span></span>',
    q:'Quanto é 4³?', options:['12','64','43'], correct:1, explain:'4³ = 4 × 4 × 4 = 64.' },
  { skill:'funcaoExp', prompt:'', q:'Qual das funções abaixo é exponencial?', options:['f(x) = 5x','f(x) = x⁵','f(x) = 5ˣ'], correct:2,
    explain:'f(x) = 5ˣ é exponencial porque o x está no expoente.' },
  { skill:'funcaoExp', prompt:'<span style="font-family:var(--font-mono); font-size:24px;">f(x) = 3<span class="exp-sup">x</span></span>',
    q:'Quanto é f(2)?', options:['6','9','5'], correct:1, explain:'f(2) = 3² = 9.' },
  { skill:'graficos', prompt:'<span style="font-family:var(--font-mono);">f(x) = 2ˣ  →  x: 0,1,2,3</span>',
    q:'Complete: f(3) = ?', options:['6','8','9'], correct:1, explain:'2³ = 8.' },
  { skill:'graficos', prompt:'graph', q:'No gráfico abaixo, quanto vale f(x) quando x = 3?', options:['6','8','9'], correct:1,
    explain:'O ponto em x = 3 está na altura 8.' },
  { skill:'graficos', prompt:'<span style="font-family:var(--font-mono); font-size:26px;">(1/4)<span class="exp-sup">x</span></span>',
    q:'Essa função cresce ou decresce?', options:['Cresce 📈','Decresce 📉'], correct:1, explain:'Base entre 0 e 1 → decresce.' },
  { skill:'equacoes', prompt:'<span style="font-family:var(--font-mono); font-size:28px;">2<span class="exp-sup">x</span> = 16</span>',
    q:'Qual o valor de x?', options:['3','4','8'], correct:1, explain:'2⁴ = 16, então x = 4.' },
  { skill:'equacoes', prompt:'<span style="font-family:var(--font-mono); font-size:28px;">64</span>',
    q:'Escreva 64 como potência de 2:', options:['2⁵','2⁶','2⁷'], correct:1, explain:'2⁶ = 64.' },
  { skill:'graficos', prompt:'', q:'Uma população de bactérias começa com 100 e dobra a cada hora. Quantas bactérias existirão depois de 4 horas? (100 × 2⁴)', options:['800','1200','1600'], correct:2, explain:'100 × 2⁴ = 100 × 16 = 1600.' },
];
var boss_idx = 0, boss_hearts = 3, boss_correct = 0;
function phase12HTML(){
  boss_idx = 0; boss_hearts = 3; boss_correct = 0;
  return `
  <div class="panel-tight" style="background:rgba(255,93,108,0.06); border-color:rgba(255,93,108,0.3); text-align:center;">
    <p style="font-size:44px; margin:0;">👹</p>
    <p style="font-family:var(--font-display); font-weight:700; font-size:18px; margin:4px 0 2px;">O Devorador de Expoentes</p>
    <p class="small-note" style="margin:0 0 10px;">10 perguntas cobrindo tudo que você aprendeu. Você tem 3 vidas — mas errar te ensina, não te elimina.</p>
    <button class="btn btn-primary" onclick="boss_startFight()">Enfrentar o Devorador</button>
  </div>`;
}
function boss_startFight(){ setPhaseBody(boss_round()); }
function boss_round(){
  if(boss_hearts <= 0){
    return `
    <div class="feedback err"><span class="tag">💀 Sem vidas</span>O Devorador venceu esta rodada — mas você não perdeu nada, só vai enfrentar de novo com mais calma.</div>
    <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="boss_startFight()">Tentar novamente</button></div>`;
  }
  if(boss_idx >= BOSS_QUESTIONS.length){
    STATE.bossBest = Math.max(STATE.bossBest, boss_correct);
    saveState();
    const passed = boss_correct >= 7;
    if(passed) completePhase(12);
    return `
    <div class="panel-tight" style="text-align:center;">
      <p style="font-size:40px; margin:0;">${passed?'🏆':'💪'}</p>
      <p style="font-family:var(--font-display); font-weight:700; font-size:19px; margin:6px 0;">${passed?'Você derrotou o Devorador de Expoentes!':'Quase lá!'}</p>
      <p class="lede" style="margin-bottom:14px;">Você acertou ${boss_correct} de ${BOSS_QUESTIONS.length} perguntas.</p>
      <div class="btn-row" style="justify-content:center;">
        ${passed ? '<button class="btn btn-primary" onclick="goToMap()">Voltar ao mapa 🎉</button>' : '<button class="btn btn-primary" onclick="boss_startFight()">Tentar de novo</button>'}
      </div>
    </div>`;
  }
  const q = BOSS_QUESTIONS[boss_idx];
  let promptHTML = '';
  if(q.prompt === 'graph') promptHTML = buildExpGraph({domId:'bossgraph', a:2, xMin:0, xMax:4, markers:[0,1,2,3,4]});
  else if(q.prompt) promptHTML = `<div class="stage">${q.prompt}</div>`;

  const hearts = Array(3).fill(0).map((_,i)=> i<boss_hearts ? '❤️' : '🖤').join('');
  const dots = BOSS_QUESTIONS.map((_,i)=>{
    let c='boss-dot'; if(i<boss_idx) c+=' done'; else if(i===boss_idx) c+=' current';
    return `<div class="${c}"></div>`;
  }).join('');

  return `
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span class="small-note">Pergunta ${boss_idx+1} / ${BOSS_QUESTIONS.length}</span>
    <span class="hearts">${hearts}</span>
  </div>
  <div class="boss-progress">${dots}</div>
  ${promptHTML}
  ${mcExercise({
    id:'boss_q'+boss_idx, question:q.q, options:q.options, correctIndex:q.correct, skill:q.skill, xp:0,
    explainCorrect: q.explain, diagnose(){ return q.explain; }, nextAction:'boss_next(true)'
  })}
  `;
}
function boss_next(fromCorrect){
  // se veio de um acerto direto, soma ponto; senão, esta função é chamada apenas pelo botão "continuar" após acerto
  boss_correct++;
  addXP(18);
  boss_idx++;
  setPhaseBody(boss_round());
}
// intercepta erro no boss para tirar vida (sem duplicar lógica do mcExercise genérico)
const _answerMC_original = answerMC;
answerMC = function(id, idx){
  const cfg = EX_REGISTRY[id];
  const isBossQ = id.startsWith('boss_q') && cfg && !cfg.solved && idx !== cfg.correctIndex;
  if(isBossQ){ boss_hearts = Math.max(0, boss_hearts-1); }
  _answerMC_original(id, idx);
  if(isBossQ && boss_hearts<=0){
    setTimeout(()=>{ document.getElementById('fb_'+id).innerHTML += `<div class="feedback err fadein" style="margin-top:10px;"><span class="tag">💀 Vidas esgotadas</span>Vamos recomeçar o desafio — sem pressa.</div><div class="btn-row"><button class="btn btn-primary btn-sm" onclick="boss_startFight()">Recomeçar desafio</button></div>`; }, 50);
  }
};

function markPhaseDone(id, msg){
  completePhase(id);
  return `<div class="panel" style="text-align:center; border-color:var(--green);">
    <p style="font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--green); margin:0 0 8px;">🏁 Fase concluída!</p>
    <p class="lede" style="margin:0 0 14px;">${msg||'Você dominou esta etapa.'}</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-primary" onclick="goToPhase(${id+1<=12?id+1:id})">${id<12?'Ir para a próxima fase →':'Ver mapa'}</button>
      <button class="btn btn-ghost" onclick="goToMap()">Mapa do laboratório</button>
    </div>
  </div>`;
}
</script>
</body>
</html>
